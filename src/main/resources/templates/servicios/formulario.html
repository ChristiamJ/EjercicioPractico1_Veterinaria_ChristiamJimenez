<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{plantilla/base :: cabecera}"></head>
    <body>
        <header th:replace="~{plantilla/base :: encabezado}"></header>
        <nav th:replace="~{plantilla/base :: barraNavegacion}"></nav>

        <main class="container my-4">

            <section class="card mb-4">
                <div class="card-header bg-success text-white">
                    <h3 class="mb-0">Servicio Veterinario</h3>
                </div>
                <div class="card-body">
                    <form th:action="@{/servicios/registrar}" th:object="${servicio}" method="post">
                        <input type="hidden" th:field="*{id}"/>
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre</label>
                            <input type="text" id="nombre" th:field="*{nombre}" class="form-control" maxlength="100" required/>
                        </div>
                        <div class="mb-3">
                            <label for="tipoServicio" class="form-label">Tipo de servicio</label>
                            <select id="tipoServicio" th:field="*{tipoServicio.id}" class="form-select" required>
                                <option value="">Seleccione un tipo</option>
                                <option th:each="tipo : ${tipos}" th:value="${tipo.id}" th:text="${tipo.nombre}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="precio" class="form-label">Precio</label>
                            <input type="number" id="precio" th:field="*{precio}" class="form-control" step="0.01" min="0" required/>
                        </div>
                        <div class="mb-3">
                            <label for="duracionMinutos" class="form-label">Duración (minutos)</label>
                            <input type="number" id="duracionMinutos" th:field="*{duracionMinutos}" class="form-control" min="1" required/>
                        </div>
                        <button type="submit" class="btn btn-success">Guardar</button>
                        <a th:href="@{/servicios}" class="btn btn-secondary">Cancelar</a>
                    </form>
                </div>
            </section>

        </main>

        <footer th:replace="~{plantilla/base :: piePagina}"></footer>
    </body>
</html>
