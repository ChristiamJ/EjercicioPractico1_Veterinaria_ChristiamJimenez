<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{plantilla/base :: cabecera}"></head>
    <body>
        <header th:replace="~{plantilla/base :: encabezado}"></header>
        <nav th:replace="~{plantilla/base :: barraNavegacion}"></nav>

        <main class="container my-4">

            <section class="card mb-4">
                <div class="card-header bg-success text-white">
                    <h3 class="mb-0">Citas Programadas</h3>
                </div>
                <div class="card-body">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>Mascota</th>
                                <th>Propietario</th>
                                <th>Fecha</th>
                                <th>Servicio</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="cita : ${citas}">
                                <td>[[${cita.nombreMascota}]]</td>
                                <td>[[${cita.nombrePropietario}]]</td>
                                <td th:text="${#temporals.format(cita.fecha, 'dd/MM/yyyy')}"></td>
                                <td>[[${cita.servicio.nombre}]]</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>

        </main>

        <footer th:replace="~{plantilla/base :: piePagina}"></footer>
    </body>
</html>
