<head th:fragment="cabecera">
    <title>[[#{clinica.nombre}]]</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
    <link th:href="@{/webjars/font-awesome/css/all.css}" rel="stylesheet"/>
    <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</head>

<header th:fragment="encabezado" class="bg-success text-white text-center py-3">
    <h1>[[#{clinica.nombre}]]</h1>
</header>

<nav th:fragment="barraNavegacion" class="navbar navbar-expand-sm navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">[[#{menu.inicio}]]</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" th:href="@{/tipos}">[[#{menu.tipos}]]</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/servicios}">[[#{menu.servicios}]]</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/citas}">[[#{menu.citas}]]</a></li>
            </ul>
        </div>
    </div>
</nav>

<footer th:fragment="piePagina" class="mt-5 py-3 bg-success text-white text-center">
    <p class="mb-0">[[#{pie.derechos}]] &copy;</p>
</footer>
