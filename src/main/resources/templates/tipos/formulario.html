<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{plantilla/base :: cabecera}"></head>
    <body>
        <header th:replace="~{plantilla/base :: encabezado}"></header>
        <nav th:replace="~{plantilla/base :: barraNavegacion}"></nav>

        <main class="container my-4">

            <section class="card mb-4">
                <div class="card-header bg-success text-white">
                    <h3 class="mb-0">Tipo de Servicio</h3>
                </div>
                <div class="card-body">
                    <form th:action="@{/tipos/registrar}" th:object="${tipoServicio}" method="post">
                        <input type="hidden" th:field="*{id}"/>
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre</label>
                            <input type="text" id="nombre" th:field="*{nombre}" class="form-control" maxlength="100" required/>
                        </div>
                        <div class="mb-3">
                            <label for="descripcion" class="form-label">Descripción</label>
                            <input type="text" id="descripcion" th:field="*{descripcion}" class="form-control" maxlength="255"/>
                        </div>
                        <button type="submit" class="btn btn-success">Guardar</button>
                        <a th:href="@{/tipos}" class="btn btn-secondary">Cancelar</a>
                    </form>
                </div>
            </section>

        </main>

        <footer th:replace="~{plantilla/base :: piePagina}"></footer>
    </body>
</html>
